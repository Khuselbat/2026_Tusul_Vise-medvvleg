# Ажиллуулах:  cp .env.example .env  (нууц утгуудаа солино)  →  docker compose up -d --build
# Схем: app эхлэхдээ migration-уудыг автоматаар ажиллуулна.
# Анхны админ: docker compose exec app npm run user:create-admin -- --email admin@example.mn --name "Админ"
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-civiz}
      MYSQL_USER: ${DB_USER:-civiz}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD тохируулна уу}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD тохируулна уу}
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'root', '-p${DB_ROOT_PASSWORD}']
      interval: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: db
      DB_NAME: ${DB_NAME:-civiz}
      DB_USER: ${DB_USER:-civiz}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET тохируулна уу}
      PASSPORT_KEY: ${PASSPORT_KEY:?PASSPORT_KEY тохируулна уу (64 hex)}
      PASSPORT_KEY_ID: ${PASSPORT_KEY_ID:-k1}
      TRUST_PROXY: '1'
      FORCE_HTTPS: ${FORCE_HTTPS:-0}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      # Үе 2: имэйл (SMTP) ба холбоосын домэйн
      APP_URL: '${APP_URL:?APP_URL тохируулна уу, жишээ нь https://viz.example.mn}'
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
      MAIL_FROM: '${MAIL_FROM:-Цахим виз <no-reply@example.mn>}'
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-0}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Үе 3: файлын сан, шифрлэлт, вирус шалгалт, хадгалах хугацаа
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_ENCRYPT: ${STORAGE_ENCRYPT:-1}
      FILE_KEY: '${FILE_KEY:?FILE_KEY тохируулна уу, openssl rand -hex 32}'
      FILE_KEY_ID: ${FILE_KEY_ID:-f1}
      FILE_KEYS_OLD: ${FILE_KEYS_OLD:-}
      PASSPORT_KEYS_OLD: ${PASSPORT_KEYS_OLD:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      RETENTION_DRAFT_DAYS: ${RETENTION_DRAFT_DAYS:-30}
    volumes:
      - files:/app/server/storage
    ports:
      - '${APP_PORT:-4000}:4000'

  # Вирус шалгалт (Үе 3): `docker compose --profile av up -d` + .env-д CLAMAV_HOST=clamav
  clamav:
    image: clamav/clamav:1.4
    profiles: ['av']
    restart: unless-stopped
    volumes:
      - clamdb:/var/lib/clamav

  # HTTPS (NFR-03): DOMAIN тохируулаад `docker compose --profile https up -d`
  caddy:
    image: caddy:2
    profiles: ['https']
    restart: unless-stopped
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data

volumes:
  clamdb:
  dbdata:
  files:
  caddydata:
