# Ажиллуулах:  cp .env.example .env  (нууц утгуудаа солино)  →  docker compose up -d --build
# Схем: app эхлэхдээ DB-г хүлээж, migration-уудыг автоматаар ажиллуулна. Production image-д seed байхгүй.
# Анхны админ: docker compose exec app node scripts/create-admin.js --email admin@example.mn --name "Админ"
# Production (VPS): docs/DEPLOYMENT.md

# Лог эргүүлэлт (Үе 5): контейнер бүр ≤ 5 × 20 MB, диск дүүрэхгүй. `docker compose logs -f app`
x-logging: &logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '5'

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    logging: *logging
    environment:
      MYSQL_DATABASE: ${DB_NAME:-civiz}
      MYSQL_USER: ${DB_USER:-civiz}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD тохируулна уу}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD тохируулна уу}
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci', '--skip-name-resolve']
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'root', '-p${DB_ROOT_PASSWORD}']
      interval: 5s
      retries: 20

  app:
    build: .
    image: civiz-app:${APP_VERSION:-latest}
    restart: unless-stopped
    logging: *logging
    # PID 1 нь tini — SIGTERM-ийг node руу дамжуулж, эхэлсэн хүсэлтүүдийг дуусгаад зогсооно (src/index.js)
    init: true
    stop_grace_period: 15s
    # Код зөвхөн уншигдана; бичих газар — хувийн файлын volume ба /tmp
    read_only: true
    tmpfs: ['/tmp']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: db
      DB_NAME: ${DB_NAME:-civiz}
      DB_USER: ${DB_USER:-civiz}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET тохируулна уу}
      PASSPORT_KEY: ${PASSPORT_KEY:?PASSPORT_KEY тохируулна уу (64 hex)}
      PASSPORT_KEY_ID: ${PASSPORT_KEY_ID:-k1}
      TRUST_PROXY: '1'
      FORCE_HTTPS: ${FORCE_HTTPS:-0}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Имэйл (SMTP) ба холбоосын домэйн. APP_BASE_URL / SMTP_PASS — шинэ нэр; APP_URL / SMTP_PASSWORD хэвээр дэмжинэ
      APP_BASE_URL: '${APP_BASE_URL:-${APP_URL:?APP_BASE_URL тохируулна уу, жишээ нь https://viz.example.mn}}'
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
      MAIL_FROM: '${MAIL_FROM:-Цахим виз <no-reply@example.mn>}'
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: '${SMTP_PASS:-${SMTP_PASSWORD:-}}'
      DOC_EXPIRY_WARN_DAYS: ${DOC_EXPIRY_WARN_DAYS:-30}
      # Үе 3: файлын сан, шифрлэлт, вирус шалгалт, хадгалах хугацаа
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_ENCRYPT: ${STORAGE_ENCRYPT:-1}
      FILE_KEY: '${FILE_KEY:?FILE_KEY тохируулна уу, openssl rand -hex 32}'
      FILE_KEY_ID: ${FILE_KEY_ID:-f1}
      FILE_KEYS_OLD: ${FILE_KEYS_OLD:-}
      PASSPORT_KEYS_OLD: ${PASSPORT_KEYS_OLD:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      RETENTION_DRAFT_DAYS: ${RETENTION_DRAFT_DAYS:-30}
      SUBMITTABLE_COUNTRIES: ${SUBMITTABLE_COUNTRIES:-KR}
    volumes:
      - files:/app/server/storage
    ports:
      # Анхдагчаар зөвхөн localhost — интернэтээс Caddy (HTTPS)-ээр л хандана. Шууд нээх бол APP_BIND=0.0.0.0
      - '${APP_BIND:-127.0.0.1}:${APP_PORT:-4000}:4000'

  # Вирус шалгалт (Үе 3): `docker compose --profile av up -d` + .env-д CLAMAV_HOST=clamav
  clamav:
    image: clamav/clamav:1.4
    profiles: ['av']
    restart: unless-stopped
    logging: *logging
    volumes:
      - clamdb:/var/lib/clamav

  # HTTPS (NFR-03): DOMAIN тохируулаад `docker compose --profile https up -d`
  caddy:
    image: caddy:2
    profiles: ['https']
    restart: unless-stopped
    logging: *logging
    depends_on:
      app: { condition: service_healthy }
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

  # Имэйл туршилт (dev): `docker compose --profile mail up -d mailpit` → .env-д SMTP_HOST=mailpit, SMTP_PORT=1025, SMTP_SECURE=0
  # Бүх захидлыг барьж http://127.0.0.1:8025 дээр харуулна — жинхэнэ хаяг руу ЯВАХГҮЙ. Production-д ашиглахгүй.
  mailpit:
    image: axllent/mailpit:latest
    profiles: ['mail']
    restart: unless-stopped
    logging: *logging
    ports: ['127.0.0.1:8025:8025', '127.0.0.1:1025:1025']

  # Uptime мониторинг (Үе 5): `docker compose --profile monitoring up -d` → SSH туннелээр http://127.0.0.1:3001
  # Монитор: HTTP(s) — https://<DOMAIN>/api/health, 60 сек; мэдэгдэл (имэйл/Telegram) тохируулна. docs/DEPLOYMENT.md §7
  uptime:
    image: louislam/uptime-kuma:1
    profiles: ['monitoring']
    restart: unless-stopped
    logging: *logging
    ports: ['127.0.0.1:3001:3001']
    volumes:
      - uptimedata:/app/data

volumes:
  clamdb:
  dbdata:
  files:
  caddydata:
  caddyconfig:
  uptimedata:
