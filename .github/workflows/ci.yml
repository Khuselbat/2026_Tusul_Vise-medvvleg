name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Тест/E2E-ийн сан (зөвхөн CI-ийн түр контейнер)
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_USER: civiz
  DB_PASSWORD: civiz_pass
  DB_NAME_TEST: civiz_test

jobs:
  lint:
    name: Lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Үе 3: хамаарлын эмзэг байдал 0 байх (lockfile-аар шалгана)
      - run: npm audit --audit-level=moderate
      - run: npm audit --audit-level=moderate
        working-directory: server
      - run: npm audit --audit-level=moderate
        working-directory: client

  s3:
    name: S3 storage (S3-compatible emulator)
    runs-on: ubuntu-latest
    env:
      S3_TEST: '1'
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_BUCKET: civiz-test
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # MinIO Docker image-ээ нийтлэхээ больсон тул S3 API-ийн эмулятор (moto) ашиглана — production-д MinIO/AWS S3 хэвээр
      - name: Start S3 emulator
        run: |
          pip install "moto[server]"
          nohup moto_server -H 127.0.0.1 -p 9000 > moto.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:9000/ >/dev/null && break; sleep 1; done
      - run: npm ci
        working-directory: server
      - run: npx cross-env NODE_ENV=test node --test test/s3.test.js
        working-directory: server

  test:
    name: Integration tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: civiz_test
          MYSQL_USER: civiz
          MYSQL_PASSWORD: civiz_pass
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server

  build:
    name: Client build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [build]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: civiz_test
          MYSQL_USER: civiz
          MYSQL_PASSWORD: civiz_pass
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: server
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
